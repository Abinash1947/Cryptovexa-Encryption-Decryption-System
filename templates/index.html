<!DOCTYPE html>
<html>
<head>
    <title>Secure File Encryption System</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #141e30, #243b55);
            color: white;
            text-align: center;
            padding-top: 120px;
        }

        .container {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        h1 {
            margin-bottom: 20px;
        }

        a {
            display: block;
            margin: 15px;
            padding: 15px 30px;
            text-decoration: none;
            background: white;
            color: #333;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            background: #00c6ff;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Secure File Encryption System</h1>
        <p>AES-256 + RSA Hybrid Encryption</p>

        <a href="/encrypt">Encrypt a File</a>
        <a href="/decrypt">Decrypt a File</a>
    </div>
</body>
</html>
