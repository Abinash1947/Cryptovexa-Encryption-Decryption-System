<!DOCTYPE html>
<html>
<head>
    <title>Encrypt File</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #1d976c, #93f9b9);
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        input[type="file"] {
            margin: 20px 0;
        }

        button {
            padding: 12px 25px;
            background: #1d976c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #148f5a;
        }

        a {
            display: block;
            margin-top: 20px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔐 Encrypt Your File</h2>
        <p>Supports Images, PDFs, Docs, Videos & More</p>

        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" required><br>
            <button type="submit">Encrypt File</button>
        </form>

        <a href="/">⬅ Back to Home</a>
    </div>
</body>
</html>
